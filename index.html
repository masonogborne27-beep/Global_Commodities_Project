<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cacao &amp; Empire</title>
  <meta name="description" content="An interactive map of cacao, chocolate, and the French empire, 1450–1800.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Map -->
  <main id="map" class="map">
    <svg id="map-svg" class="map-svg" role="img" aria-label="Antique-style world map showing the stops and trade routes of the journey"></svg>
    <canvas id="detail-canvas" class="detail-canvas" aria-hidden="true"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>
    <svg id="routes-svg" class="routes-svg" aria-hidden="true" focusable="false">
      <defs>
        <marker id="arrow-ocean" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 Z" class="arrow-ocean"/>
        </marker>
        <marker id="arrow-land" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
          <path d="M0,1 L9,5 L0,9 Z" class="arrow-land"/>
        </marker>
        <!-- A three-masted, square-rigged merchant ship (bow to the right). Drawn
             around the waterline at (0, 8); js/main.js moves, flips and scales it. -->
        <symbol id="ship" viewBox="-34 -45 72 57" overflow="visible">
          <path class="ship-wake" d="M-34 10.5 q3.5 -2.6 7 0 t7 0 t7 0 t7 0 t7 0 t7 0 t7 0 t7 0 t7 0"/>
          <path class="ship-foam" d="M22 10 q4 -1.5 8 -3.8 M26 10.6 q4 -1 9 -2.2"/>
          <path class="ship-rig" d="M15 -35 L35.5 -11.5 M0 -41 L15 -26 M-14 -33 L0 -27 M0 -33 L-8 -3 M0 -33 L9 -3 M15 -26 L10 -5.2 M15 -26 L21 -5.2 M-14 -27 L-19 -10 M-14 -27 L-9.5 -6"/>
          <path class="ship-spar" d="M15 -5 V-35 M0 -3 V-43 M-14 -10 V-33 M24 -4.5 L36 -11.5 M6 -17 H24 M9 -26 H21 M11 -32 H19 M-10.5 -20 H10.5 M-8.5 -31 H8.5 M-5.5 -38 H5.5 M-6 -11 L-23 -31"/>
          <path class="ship-sail" d="M-23 -31 L-6 -11 L-23 -12 Z"/>
          <path class="ship-sail" d="M6.5 -17 H23.5 L24.8 -7 Q15 -4.2 5.2 -7 Z"/>
          <path class="ship-sail" d="M9 -26 H21 L22.5 -18 Q15 -16 7.5 -18 Z"/>
          <path class="ship-sail" d="M11 -32 H19 L20 -27 Q15 -25.8 10 -27 Z"/>
          <path class="ship-sail" d="M-10 -20 H10 L11.5 -7 Q0 -3.8 -11.5 -7 Z"/>
          <path class="ship-sail" d="M-8 -31 H8 L9.5 -21 Q0 -18.5 -9.5 -21 Z"/>
          <path class="ship-sail" d="M-5 -38 H5 L6.5 -32 Q0 -30.5 -6.5 -32 Z"/>
          <path class="ship-sail" d="M27.5 -6.4 L33 -9.8 L32 -3.5 Q29.5 -2.2 27 -3.5 Z"/>
          <path class="ship-hull" d="M-24 -10 L-24 -8 C-27 -4 -26 1 -22 5 C-17 9.5 -8 10 0 10 C12 10 21 6 26 0.5 L29 -4.5 L23 -5.2 L14 -5.2 L14 -3 L-6 -3 L-6 -6 L-14 -6 L-14 -10 Z"/>
          <path class="ship-lower" d="M-22 5 C-17 9.5 -8 10 0 10 C12 10 21 6 26 0.5 C20 4 8 6 -2 6.2 C-12 6.2 -19 5.8 -22 5 Z"/>
          <path class="ship-wale" d="M-25.5 -2 C-18 0.5 0 1.5 10 0.5 C18 -0.5 24 -2.5 27 -4"/>
          <path class="ship-plank" d="M-21 3.2 C-12 5.2 4 5.4 18 2.8"/>
          <path class="ship-port" d="M-4 -2.3 h2 v1.4 h-2 Z M-0.4 -2.3 h2 v1.4 h-2 Z M3.2 -2.3 h2 v1.4 h-2 Z M6.8 -2.3 h2 v1.4 h-2 Z M10.4 -2.3 h2 v1.4 h-2 Z"/>
          <path class="ship-window" d="M-22.8 -8.6 h1.8 v1.6 h-1.8 Z M-19.9 -8.6 h1.8 v1.6 h-1.8 Z M-17 -8.6 h1.8 v1.6 h-1.8 Z"/>
          <path class="ship-spar" d="M-24 -10 V-21"/>
          <path class="ship-ensign" d="M-24 -21 L-15.5 -19.6 L-24 -17.6 Z"/>
          <path class="ship-pennant" d="M0 -43.6 L9.5 -42 L0 -40.5 Z M15 -35.6 L22 -34.4 L15 -33.4 Z M-14 -33.6 L-7.5 -32.5 L-14 -31.5 Z"/>
        </symbol>
      </defs>
      <g id="routes-layer"></g>
      <g id="ships-layer"></g>
    </svg>
    <div id="markers" class="markers" role="group" aria-label="Journey stops"></div>
  </main>

  <!-- Scene: a full-screen period picture the camera dives into at some stops -->
  <section id="scene" class="scene" aria-label="Scene" aria-hidden="true" inert>
    <div id="scene-stage" class="scene-stage">
      <img id="scene-img" class="scene-img" alt="" decoding="async">
      <div id="scene-hotspots" class="scene-hotspots"></div>
    </div>
    <div class="scene-vignette" aria-hidden="true"></div>
    <button id="scene-back" class="btn btn-ghost scene-back" type="button">← Back to the map</button>
    <div id="scene-caption" class="scene-caption"></div>
    <div id="scene-popover" class="scene-popover" role="dialog" aria-live="polite" hidden></div>
  </section>

  <!-- A wisp of cloud the camera passes through on the way into a scene -->
  <div id="dive-mist" class="dive-mist" aria-hidden="true"></div>
  <div id="dive-mist-near" class="dive-mist dive-mist-near" aria-hidden="true"></div>
  <div id="dive-whiteout" class="dive-whiteout" aria-hidden="true"></div>

  <!-- Decorations -->
  <div class="paper-texture" aria-hidden="true"></div>
  <svg class="compass" viewBox="-50 -50 100 100" aria-hidden="true" focusable="false">
    <circle r="34" class="compass-ring"/>
    <circle r="28" class="compass-ring thin"/>
    <path class="compass-star" d="M0,-44 L6,-6 L0,0 Z M0,44 L-6,6 L0,0 Z M44,0 L6,6 L0,0 Z M-44,0 L-6,-6 L0,0 Z"/>
    <path class="compass-star dark" d="M0,-44 L-6,-6 L0,0 Z M0,44 L6,6 L0,0 Z M44,0 L6,-6 L0,0 Z M-44,0 L-6,6 L0,0 Z"/>
    <text y="-46" class="compass-n">N</text>
  </svg>

  <!-- Top bar -->
  <header class="topbar">
    <div class="year-badge" aria-live="polite">
      <span class="year-badge-label">Year</span>
      <span id="year" class="year-badge-value">1450</span>
    </div>
    <p id="topbar-title" class="topbar-title"></p>
    <div class="topbar-actions">
      <button id="overview-btn" class="btn btn-ghost" type="button" hidden>Overview</button>
      <button id="sources-btn" class="btn btn-ghost" type="button">Sources</button>
    </div>
  </header>

  <!-- Legend and hint -->
  <div class="legend" aria-label="Map legend">
    <div class="legend-row"><svg width="34" height="12" aria-hidden="true"><path d="M2,6 H32" class="legend-ocean"/></svg> Ocean route</div>
    <div class="legend-row"><svg width="34" height="12" aria-hidden="true"><path d="M2,6 H32" class="legend-land"/></svg> Land route</div>
    <div class="legend-row"><span class="legend-dot next" aria-hidden="true"></span> Next stop</div>
    <div class="legend-row"><span class="legend-dot visited" aria-hidden="true"></span> Visited</div>
  </div>
  <p id="hint" class="hint" aria-live="polite" hidden></p>

  <!-- Side panel / bottom sheet -->
  <aside id="panel" class="panel" aria-labelledby="panel-title" inert>
    <button id="panel-handle" class="panel-handle" type="button" aria-label="Resize panel"><span></span></button>
    <button id="panel-close" class="panel-close" type="button" aria-label="Close panel">&times;</button>
    <div id="panel-body" class="panel-body"></div>
    <div id="panel-footer" class="panel-footer"></div>
  </aside>

  <!-- Title card -->
  <section id="title-card" class="title-card" aria-labelledby="title-card-title">
    <div class="title-card-inner">
      <div class="title-ornament" aria-hidden="true">&#10086;</div>
      <h1 id="title-card-title" class="title-card-title">Loading…</h1>
      <p id="title-card-subtitle" class="title-card-subtitle"></p>
      <div class="title-card-rule" aria-hidden="true"></div>
      <p id="title-card-question" class="title-card-question"></p>
      <p id="title-card-authors" class="title-card-authors"></p>
      <div id="title-card-error" class="error-box" role="alert" hidden></div>
      <button id="begin-btn" class="btn btn-primary btn-large" type="button" disabled>Begin the journey</button>
    </div>
  </section>

  <!-- Sources dialog -->
  <dialog id="sources-dialog" class="sources-dialog" aria-labelledby="sources-title">
    <div class="dialog-head">
      <h2 id="sources-title">Sources &amp; Image Credits</h2>
      <button id="sources-close" class="panel-close static" type="button" aria-label="Close sources">&times;</button>
    </div>
    <div id="sources-body" class="dialog-body"></div>
  </dialog>

  <noscript><p class="noscript">This interactive map needs JavaScript turned on.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/scene-anim.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
